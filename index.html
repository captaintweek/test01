<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage PDF avec navigation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        canvas {
            border: 1px solid #ddd;
            margin: 10px auto;
            display: block;
        }
        .nav-buttons {
            margin-top: 10px;
        }
        button {
            font-size: 20px;
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Affichage d'un PDF</h1>

    <canvas id="pdf-canvas"></canvas>

    <div class="nav-buttons">
        <button onclick="previousPDF()">⬅ Précédent</button>
        <button onclick="nextPDF()">Suivant ➡</button>
    </div>

    <script>
        const pdfFiles = ["document1.pdf", "document2.pdf", "document3.pdf"]; // Liste des PDFs
        let currentPdfIndex = 0;

        const canvas = document.getElementById("pdf-canvas");
        const ctx = canvas.getContext("2d");

        function loadPDF(index) {
            if (index < 0 || index >= pdfFiles.length) return;
            
            const url = pdfFiles[index];

            pdfjsLib.getDocument(url).promise.then(pdf => {
                return pdf.getPage(1);
            }).then(page => {
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                page.render(renderContext);
            }).catch(error => {
                console.error("Erreur lors du chargement du PDF : ", error);
            });
        }

        function previousPDF() {
            if (currentPdfIndex > 0) {
                currentPdfIndex--;
                loadPDF(currentPdfIndex);
            }
        }

        function nextPDF() {
            if (currentPdfIndex < pdfFiles.length - 1) {
                currentPdfIndex++;
                loadPDF(currentPdfIndex);
            }
        }

        // Charger le premier PDF au démarrage
        loadPDF(currentPdfIndex);
    </script>
</body>
</html>
